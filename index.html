<body>
<script type="module" src="./src/index.ts"></script>
<script type="text/javascript">
  function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map(v => v.trim()).filter(v => !!v);
  }

  function parseName(nameStr) {
    const weightRegex = /\/(\d+)/;
    const countRegex = /\*(\d+)/;
    const seatRegex = /@(\d+)/;
    const name = (/^\s*([^\/*@]+)?/.exec(nameStr)[1] || '').trim();
    const weight = weightRegex.test(nameStr) ? parseInt(weightRegex.exec(nameStr)[1], 10) : 1;
    const seat = seatRegex.test(nameStr) ? parseInt(seatRegex.exec(nameStr)[1], 10) : 0;
    // 고정 자리는 하나뿐이므로 개수 꼬리표는 무시한다.
    const count = seat ? 1 : countRegex.test(nameStr) ? parseInt(countRegex.exec(nameStr)[1], 10) : 1;
    return { name, weight, count, seat };
  }

  // 꼬리표를 다시 문자열로. withSeat 가 false 면 @번호를 뗀다(구슬로 굴릴 때).
  function formatName(entry, withSeat) {
    return (
      entry.name +
      (entry.weight > 1 ? `/${entry.weight}` : '') +
      (entry.count > 1 ? `*${entry.count}` : '') +
      (withSeat && entry.seat ? `@${entry.seat}` : '')
    );
  }

  // 자리 모드 계획. 고정된 사람과 이미 앉은 사람은 굴리지 않는다. 자리 수는 인원과
  // 가장 큰 고정 번호 중 큰 쪽. 같은 번호에 두 명이 붙으면 먼저 적은 사람이 앉는다.
  //
  // 색은 여기서 정한다. 전체 명단을 한 명씩 펼쳐 색상환을 그 인원수로 나누고, 그 색을
  // 사람에게 붙여 둔다. 나눠 굴려서 판마다 구슬 수가 달라져도 색이 겹치거나 바뀌지 않는다.
  function getSeatPlan() {
    const entries = getNames().map(parseName).filter((entry) => entry.name);
    const fixed = {};
    const roster = []; // 전원을 한 명씩 펼친 목록(고정 포함)
    entries.forEach((entry) => {
      const pinned = entry.seat > 0 && !fixed[entry.seat];
      if (pinned) fixed[entry.seat] = entry.name;
      for (let i = 0; i < entry.count; i++) {
        roster.push({ name: entry.name, weight: entry.weight, pinned });
      }
    });
    roster.forEach((person, index) => {
      person.hue = (360 / roster.length) * index;
    });
    const label = (person) => person.name + (person.weight > 1 ? `/${person.weight}` : '');

    // 명단이나 고정이 바뀌면 앞 판에서 앉힌 자리는 의미가 없어진다. 섞기·탭 전환·판 사이
    // 재준비는 명단이 같으므로 자리를 지우지 않는다.
    const signature = JSON.stringify([roster.map(label).sort(), fixed]);
    if (signature !== seatSignature) {
      seatSignature = signature;
      seatAssignments = {};
    }

    // 이미 앉은 사람은 다음 판에서 뺀다. 동명이인은 색까지 맞는 쪽을 먼저 찾는다.
    const people = roster.filter((person) => !person.pinned);
    Object.values(seatAssignments).forEach((seated) => {
      let index = people.findIndex((person) => person.name === seated.name && person.hue === seated.hue);
      if (index < 0) index = people.findIndex((person) => person.name === seated.name);
      if (index >= 0) people.splice(index, 1);
    });

    const seats = Math.max(roster.length, 0, ...Object.keys(fixed).map(Number));
    return {
      seats,
      fixed,
      racers: people.map(label),
      racerHues: people.map((person) => person.hue),
      everyone: roster.map(label),
      everyoneHues: roster.map((person) => person.hue),
      fixedCount: Object.keys(fixed).length,
    };
  }

  function getReady() {
    const plan = getSeatPlan();
    // 자리 모드에서만 고정된 사람이 빠진다. 그냥 추첨이면 @번호는 무시하고 전원 굴린다.
    const racers = isSeatMode() ? plan.racers : plan.everyone;
    const hues = isSeatMode() ? plan.racerHues : plan.everyoneHues;
    window.roulette.setMarbles(racers, hues);
    ready = racers.length > 0;
    localStorage.setItem('mbr_names', getNames().join(','));
    applyWinnerSelection();
    // 자리 패널이 이름·고정 변화를 따라가도록 알린다.
    document.dispatchEvent(new CustomEvent('names-ready', { detail: { total: window.roulette.getCount(), plan } }));
  }

  // 당첨 규칙을 한 곳에서 계산한다.
  //   first  : 앞에서 N명  -> 마지막 당첨 순위 = N
  //   last   : 뒤에서 N명  -> 마지막 당첨 순위 = 전체 인원
  //   custom : 지정한 순위 1명
  function applyWinnerSelection() {
    const total = window.roulette.getCount();
    const parsed = parseInt(document.querySelector('#in_winnerCount').value, 10);
    let count = isNaN(parsed) || parsed < 1 ? 1 : parsed;
    let rank;

    const seatMode = isSeatMode();
    if (seatMode) {
      // 이번 판에 뽑을 인원만큼 들어오면 레이스가 끝난다. 비워 두면 남은 전원.
      const batch = parseInt(document.querySelector('#in_seatBatch').value, 10);
      count = Math.max(1, Math.min(isNaN(batch) || batch < 1 ? total : batch, Math.max(total, 1)));
      rank = count;
    } else if (winnerType === 'custom') {
      count = 1;
      rank = customRank;
    } else {
      count = Math.min(count, Math.max(total, 1));
      rank = winnerType === 'last' ? Math.max(total, 1) : count;
    }

    ['.btn-first-winner', '.btn-last-winner', '#in_winningRank', '#in_winnerCount'].forEach((selector) => {
      document.querySelector(selector).disabled = seatMode;
    });

    // 자리 모드의 강제값은 입력칸에 쓰지 않는다. 그래야 메모 탭으로 돌아왔을 때
    // 사용자가 두었던 규칙이 그대로 살아난다.
    if (!seatMode) {
      document.querySelector('#in_winnerCount').value = count;
      document.querySelector('#in_winningRank').value = rank;
    }
    window.options.winningRank = rank - 1;
    window.options.winnerCount = count;
    window.roulette.setWinningRank(window.options.winningRank);
    window.roulette.setWinnerCount(count);

    if (winnerType === 'first') {
      document.querySelector('.btn-first-winner').classList.toggle('active', true);
      document.querySelector('.btn-last-winner').classList.toggle('active', false);
      document.querySelector('#in_winningRank').classList.toggle('active', false);
    } else if (winnerType === 'last') {
      document.querySelector('.btn-first-winner').classList.toggle('active', false);
      document.querySelector('.btn-last-winner').classList.toggle('active', true);
      document.querySelector('#in_winningRank').classList.toggle('active', false);
    } else if (winnerType === 'custom') {
      document.querySelector('.btn-first-winner').classList.toggle('active', false);
      document.querySelector('.btn-last-winner').classList.toggle('active', false);
      document.querySelector('#in_winningRank').classList.toggle('active', true);
    }
  }


  // 폰에서는 메모/자리 패널이 아래 시트로 뜬다. 열린 채 시작하면 레이스 화면을 절반 가리므로
  // 접어 둔다. 앱 초기화를 기다리면 펼쳐졌다 내려가는 깜빡임이 보여서, 첫 화면 전에 여기서 한다.
  if (window.matchMedia('(max-width: 750px)').matches) {
    document.documentElement.classList.add('memo-collapsed');
  }

  let ready = false;
  let winnerType = 'first';
  let customRank = 1;
  // 우측 패널의 활성 탭. '자리' 탭이면 당첨 규칙이 자리 배치용으로 바뀐다.
  let activeTab = localStorage.getItem('mbr_tab') === 'seat' ? 'seat' : 'memo';
  const isSeatMode = () => activeTab === 'seat';
  // 자리 배치 상태. 판을 넘겨 누적되므로 굴릴 사람 계산(getSeatPlan)과 패널이 함께 본다.
  let seatAssignments = {}; // 자리 번호(1부터) -> { name, hue }
  let seatSignature = '';

  document.addEventListener('DOMContentLoaded', () => {
    initialize();
  });

  function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
      console.log('does not loaded yet');
      setTimeout(initialize, 100);
      return;
    }
    console.log('initializing start');

    const urlParams = new URLSearchParams(window.location.search);
    const namesFromUrl = urlParams.get('names');

    if (namesFromUrl) {
      document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    } else {
      const savedNames = localStorage.getItem('mbr_names');
      if (savedNames) {
        document.querySelector('#in_names').value = savedNames;
      }
    }
    const namesInput = document.querySelector('#in_names');
    // 한글은 자모를 조합하는 동안에도 input 이 계속 발생한다. 그때마다 구슬을 전부
    // 지우고 다시 만들면(물리 바디 재생성) 입력이 끊겨 조합이 낱자로 확정될 수 있다.
    // 조합 중에는 건너뛰고 조합이 끝났을 때 한 번만 반영한다.
    namesInput.addEventListener('input', (e) => {
      if (e.isComposing) return;
      getReady();
    });
    namesInput.addEventListener('compositionend', () => {
      getReady();
    });

    document.querySelector('#in_names').addEventListener('blur', () => {
      const nameSource = getNames();
      const nameSet = new Set();
      const nameCounts = {};
      nameSource.forEach(nameSrc => {
        const entry = parseName(nameSrc);
        if (!entry.name) return;
        const key = entry.name + (entry.weight > 1 ? `/${entry.weight}` : '') + (entry.seat ? `@${entry.seat}` : '');
        if (!nameSet.has(key)) {
          nameSet.add(key);
          nameCounts[key] = 0;
        }
        nameCounts[key] = entry.seat ? 1 : nameCounts[key] + entry.count;
      });
      const result = [];
      Object.keys(nameCounts).forEach(key => {
        if (nameCounts[key] > 1) {
          result.push(`${key}*${nameCounts[key]}`);
        } else {
          result.push(key);
        }
      });

      const oldValue = document.querySelector('#in_names').value;
      const newValue = result.join(',');

      if (oldValue !== newValue) {
        document.querySelector('#in_names').value = newValue;
        getReady();
      }
    });

    document.querySelector('#btnShuffle').addEventListener('click', () => {
      getReady();
    });

    // 결과 뒤 설정 패널을 되돌리는 예약. 그 사이에 다시 시작하거나 정지하면 취소해야
    // 레이스 도중에 패널이 뒤늦게 튀어나오지 않는다.
    let settingsTimer = null;
    const cancelSettingsTimer = () => {
      if (settingsTimer) {
        clearTimeout(settingsTimer);
        settingsTimer = null;
      }
    };

    const btnPause = document.querySelector('#btnPause');
    const btnStop = document.querySelector('#btnStop');
    const pauseIcon = btnPause.querySelector('.icon');

    // 시작/일시정지/정지의 눌림 가능 여부를 한 곳에서 맞춘다.
    const updateTransport = () => {
      const running = window.roulette.isRunning;
      const paused = window.roulette.isPaused;
      document.querySelector('#btnStart').disabled = running;
      // 레이스 중에 섞으면 구슬이 새로 만들어져 진행이 깨진다.
      document.querySelector('#btnShuffle').disabled = running;
      btnPause.disabled = !running;
      pauseIcon.classList.toggle('pause', !paused);
      pauseIcon.classList.toggle('play', paused);
      btnPause.title = paused ? '계속' : '일시정지';
    };

    document.querySelector('#btnStart').addEventListener('click', () => {
      if (!ready) {
        if (isSeatMode()) {
          const plan = getSeatPlan();
          if (Object.keys(seatAssignments).length > 0) simpleToast('남은 사람이 없습니다. 다시 하려면 자리 비우기');
          else if (plan.fixedCount > 0) simpleToast('전원이 고정 자리라 굴릴 사람이 없습니다');
        }
        return;
      }
      cancelSettingsTimer();
      beginSeatRound();
      document.querySelector('#settings').classList.add('hide');
      window.roulette.startRecording().then(() => {
        window.roulette.start();
        updateTransport();
      });
    });

    btnPause.addEventListener('click', () => {
      window.roulette.setPaused(!window.roulette.isPaused);
      updateTransport();
    });

    btnStop.addEventListener('click', () => {
      cancelSettingsTimer();
      abortSeatRound();
      window.roulette.stopRace();
      // 구슬을 이름 목록 기준으로 다시 만들면 시작 직전 상태로 돌아간다.
      getReady();
      document.querySelector('#settings').classList.remove('hide');
      updateTransport();
    });

    document.querySelector('#chkAutoRecording').addEventListener('change', (e) => {
      window.options.autoRecording = e.target.matches(':checked');
      window.roulette.setAutoRecording(window.options.autoRecording);
    });

    document.querySelector('#chkSkill').addEventListener('change', (e) => {
      window.options.useSkills = e.target.matches(':checked');
      window.roulette.setWinningRank(window.options.winningRank);
    });

    document.querySelector('#chkDarkMode').addEventListener('change', (e) => {
      window.options.darkMode = e.target.matches(':checked');
      window.roulette.setTheme(window.options.darkMode ? 'dark' : 'light');
      document.documentElement.classList.toggle('light', !window.options.darkMode);
    });

    document.querySelector('#in_winningRank').addEventListener('change', (e) => {
      const v = parseInt(e.target.value, 10);
      winnerType = 'custom';
      customRank = isNaN(v) || v < 1 ? 1 : v;
      applyWinnerSelection();
    });

    document.querySelector('#in_winnerCount').addEventListener('change', () => {
      // 지정 순위 모드는 1명 고정이므로, 인원을 건드리면 앞에서 N명으로 전환한다.
      if (winnerType === 'custom') winnerType = 'first';
      applyWinnerSelection();
    });

    document.querySelector('.btn-last-winner').addEventListener('click', () => {
      winnerType = 'last';
      applyWinnerSelection();
    });
    document.querySelector('.btn-first-winner').addEventListener('click', () => {
      winnerType = 'first';
      applyWinnerSelection();
    });

    // ------------------------------------------------------------ 메모 패널
    const memoBody = document.querySelector('#memoBody');
    const btnMemoResult = document.querySelector('#btnMemoResult');
    const titleInput = document.querySelector('#in_title');
    let lastResult = null;
    let roundNo = 0;
    // 회차는 제목 단위로 센다. 제목을 바꾸면 새 묶음이 시작된다.
    let countedTitle = null;
    // 메모 맨 아래에 이미 들어가 있는 묶음 제목. 같은 제목이면 머리글을 다시 넣지 않는다.
    let insertedTitle = null;

    titleInput.value = localStorage.getItem('mbr_title') || '';
    titleInput.addEventListener('input', () => {
      localStorage.setItem('mbr_title', titleInput.value);
    });

    // 줄마다 접두사를 보고 class 만 바꾼다. 텍스트 노드를 다시 만들지 않으므로
    // 한글 조합 중에 호출돼도 입력이 깨지지 않는다.
    const restyleMemo = () => {
      memoBody.childNodes.forEach((node) => {
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const text = node.textContent || '';
        node.className = text.startsWith('## ') ? 'memo-h2' : text.startsWith('# ') ? 'memo-h1' : '';
      });
    };

    // innerText 는 패널이 숨겨져(display:none) 있으면 줄바꿈을 잃는다. 자리 탭에 있을 때도
    // 메모 텍스트가 필요하므로 줄 요소를 직접 이어 붙인다.
    const memoText = () =>
      [...memoBody.childNodes]
        .map((node) => node.textContent)
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .replace(/^\s+/, '')
        .replace(/\s+$/, '');

    const appendMemoLines = (lines) => {
      const lastLine = memoBody.lastElementChild ? memoBody.lastElementChild.textContent.trim() : '';
      if (memoText().trim() !== '' && lastLine !== '') lines = ['', ...lines];
      lines.forEach((line) => {
        const div = document.createElement('div');
        if (line === '') {
          div.appendChild(document.createElement('br'));
        } else {
          div.textContent = line;
        }
        memoBody.appendChild(div);
      });
      restyleMemo();
      memoBody.scrollTop = memoBody.scrollHeight;
    };

    const rememberResult = (detail) => {
      const names = (detail && detail.winners) || (detail && detail.winner ? [detail.winner] : []);
      if (names.length === 0) return;
      // 제목과 시각은 버튼을 누른 때가 아니라 추첨이 끝난 때를 기준으로 잡는다.
      const title = titleInput.value.trim();
      if (title !== countedTitle) {
        countedTitle = title;
        roundNo = 0;
      }
      roundNo++;
      // 당첨 구간의 첫 순위. 뒤에서 N명이면 1위가 아니라 중간 순위부터 시작한다.
      const firstRank = window.options.winningRank + 2 - names.length;
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const resultLines = isSeatMode() ? roundLines() : names.map((name, i) => `${firstRank + i}위 ${name}`);
      lastResult = { title, lines: [`## ${roundNo}회차 · ${time}`, ...resultLines] };
      btnMemoResult.disabled = false;
    };

    memoBody.addEventListener('input', restyleMemo);

    btnMemoResult.disabled = true;
    btnMemoResult.addEventListener('click', () => {
      if (!lastResult) return;
      const lines = [];
      // 묶음이 바뀔 때만 제목을 머리글로 넣어 결과들을 갈라 준다.
      if (lastResult.title && lastResult.title !== insertedTitle) {
        lines.push(`# ${lastResult.title}`);
      }
      lines.push(...lastResult.lines);
      appendMemoLines(lines);
      insertedTitle = lastResult.title;
    });

    // clipboard API 가 권한에 막히는 환경이 있어 execCommand 로 한 번 더 시도한다.
    const copyToClipboard = async (text) => {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(area);
        return copied;
      }
    };

    document.querySelector('#btnMemoCopy').addEventListener('click', async () => {
      const text = memoText();
      if (!text.trim()) {
        simpleToast('메모가 비어 있습니다');
        return;
      }
      simpleToast((await copyToClipboard(text)) ? '메모를 복사했습니다' : '복사에 실패했습니다');
    });

    // ------------------------------------------------------------ 배속
    // 설정 패널은 시작하면 숨으므로, 배속은 항상 보이는 별도 컨트롤로 둔다.
    const speedButtons = [...document.querySelectorAll('.speed-btn')];
    speedButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const value = Number(button.dataset.speed);
        window.roulette.setSpeed(value);
        speedButtons.forEach((other) => other.classList.toggle('active', other === button));
      });
    });

    // 메모만 비운다. 진행 중인 추첨, 이름, 제목, 배속은 건드리지 않는다.
    // 회차와 묶음 제목 추적도 함께 되돌려, 다음 기록이 1회차부터 시작하게 한다.
    document.querySelector('#btnReset').addEventListener('click', () => {
      const hasMemo = memoText().trim() !== '';
      if (hasMemo && !confirm('메모를 모두 지웁니다.\n되살릴 수 없습니다. 계속할까요?')) {
        return;
      }
      memoBody.innerHTML = '<div><br></div>';
      lastResult = null;
      roundNo = 0;
      countedTitle = null;
      insertedTitle = null;
      btnMemoResult.disabled = true;
    });

    // ------------------------------------------------------------ 자리 배치
    const seatMap = document.querySelector('#seatMap');
    const seatStatus = document.querySelector('#seatStatus');
    const sidePanels = { memo: document.querySelector('#memoPanel'), seat: document.querySelector('#seatPanel') };
    const tabButtons = [...document.querySelectorAll('.side-tab')];
    let seatPlan = { seats: 0, fixed: {}, racers: [], fixedCount: 0 };

    // 자리 이름표. 기본은 번호고, 고친 것만 자리 위치(번호)를 키로 저장한다. 테이블에 붙는
    // 값이라 명단이 바뀌거나 자리를 비워도 남는다.
    let seatLabels = {};
    try {
      seatLabels = JSON.parse(localStorage.getItem('mbr_seat_labels') || '{}') || {};
    } catch (e) {
      seatLabels = {};
    }
    const saveSeatLabels = () => localStorage.setItem('mbr_seat_labels', JSON.stringify(seatLabels));
    const seatLabel = (no) => seatLabels[no] || String(no);
    // 메모에 적을 때: 고친 이름표는 그대로, 아니면 "3번".
    const seatLineLabel = (no) => seatLabels[no] || `${no}번`;

    // 판(한 번의 레이스) 단위 상태. 자리는 판을 넘겨 누적되고, 판마다 그때 비어 있던
    // 자리를 번호순으로 채운다.
    let roundOpenSeats = [];
    let roundSeats = [];
    let roundActive = false;
    let roundStartedEmpty = false;

    const escapeHtml = (text) =>
      String(text).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

    const openSeats = () => {
      const list = [];
      for (let no = 1; no <= seatPlan.seats; no++) {
        if (!seatPlan.fixed[no] && !seatAssignments[no]) list.push(no);
      }
      return list;
    };

    // 이번 판 k등은 판 시작 때 비어 있던 자리 중 k번째에 앉는다.
    const seatPerson = (rank, entry) => {
      const no = roundOpenSeats[rank - 1];
      if (!no) return;
      seatAssignments[no] = { name: entry.name, hue: entry.hue };
      if (!roundSeats.includes(no)) roundSeats.push(no);
    };

    // 테이블을 세로로 두고 양쪽에 앉힌다. 번호는 줄 단위로 읽는다: 1-2 / 3-4 / 5-6.
    const renderSeats = () => {
      const total = seatPlan.seats;
      if (total === 0) {
        seatMap.innerHTML = '<div class="seat-empty">이름을 입력하면 자리가 생깁니다</div>';
        seatStatus.textContent = '';
        return;
      }
      const labelHtml = (no) =>
        `<span class="seat-no${seatLabels[no] ? ' custom' : ''}" data-seat="${no}" title="${no}번 자리 · 눌러서 이름표 바꾸기">${escapeHtml(seatLabel(no))}</span>`;
      const seatHtml = (no) => {
        const fixedName = seatPlan.fixed[no];
        if (fixedName) {
          return `<div class="seat fixed">${labelHtml(no)}<span class="seat-name">${escapeHtml(fixedName)}</span><span class="seat-pin">고정</span></div>`;
        }
        const taken = seatAssignments[no];
        const color = taken ? `hsl(${taken.hue} 100% 70%)` : '';
        return `<div class="seat${taken ? ' filled' : ''}" style="--seat-color:${color}">${labelHtml(no)}<span class="seat-name">${taken ? escapeHtml(taken.name) : ''}</span></div>`;
      };
      const left = [];
      const right = [];
      for (let no = 1; no <= total; no++) (no % 2 === 1 ? left : right).push(seatHtml(no));
      seatMap.innerHTML = `<div class="seat-layout"><div class="seat-col">${left.join('')}</div><div class="seat-table"></div><div class="seat-col">${right.join('')}</div></div>`;

      // seatPlan.racers 는 마지막 준비 시점 기준이라, 판이 돌거나 막 끝난 동안은 이번 판에 앉은 수를 뺀다.
      const waiting = Math.max(0, seatPlan.racers.length - roundSeats.length);
      seatStatus.textContent = `남은 ${waiting}명`;
      document.querySelector('#btnSeatLabelReset').hidden = Object.keys(seatLabels).length === 0;
    };

    // 번호(이름표)를 누르면 그 자리에서 고친다. 굴리는 중에는 도착할 때마다 판을 다시
    // 그리므로 막는다. 비워서 저장하면 번호로 돌아간다.
    seatMap.addEventListener('click', (e) => {
      const tag = e.target.closest('.seat-no');
      if (!tag || window.roulette.isRunning || tag.querySelector('input')) return;
      const no = Number(tag.dataset.seat);
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 8;
      input.className = 'seat-label-input';
      input.value = seatLabels[no] || '';
      input.placeholder = String(no);
      tag.textContent = '';
      tag.appendChild(input);
      input.focus();
      input.select();

      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        if (save) {
          const value = input.value.trim();
          if (value && value !== String(no)) seatLabels[no] = value;
          else delete seatLabels[no];
          saveSeatLabels();
        }
        // 판 전체를 다시 그리지 않는다. 한 자리를 고치다 곧장 다른 자리를 누르면, 누르는 순간의
        // 블러로 여기가 불리는데, 그때 DOM 을 갈아치우면 눌린 칸이 사라져 브라우저가 그 클릭을
        // 버린다(누른 요소와 뗀 요소가 달라짐). 이 칸만 제자리에서 되돌린다.
        tag.textContent = seatLabel(no);
        tag.classList.toggle('custom', Boolean(seatLabels[no]));
        document.querySelector('#btnSeatLabelReset').hidden = Object.keys(seatLabels).length === 0;
      };
      input.addEventListener('keydown', (ev) => {
        if (ev.isComposing) return; // 한글 조합을 확정하는 엔터는 저장으로 치지 않는다
        if (ev.key === 'Enter') finish(true);
        else if (ev.key === 'Escape') finish(false);
      });
      input.addEventListener('blur', () => finish(true));
    });

    document.querySelector('#btnSeatLabelReset').addEventListener('click', () => {
      seatLabels = {};
      saveSeatLabels();
      renderSeats();
    });

    // 결과 넣기용. 이번 판에 앉은 자리만 번호순으로. 고정 자리는 첫 판에 함께 적는다.
    const roundLines = () => {
      const rows = roundSeats.map((no) => ({ no, text: `${seatLineLabel(no)} ${seatAssignments[no].name}` }));
      if (roundStartedEmpty) {
        Object.keys(seatPlan.fixed).forEach((key) => {
          rows.push({ no: Number(key), text: `${seatLineLabel(Number(key))} ${seatPlan.fixed[key]} (고정)` });
        });
      }
      return rows.sort((a, b) => a.no - b.no).map((row) => row.text);
    };

    const beginSeatRound = () => {
      roundOpenSeats = openSeats();
      roundStartedEmpty = Object.keys(seatAssignments).length === 0;
      roundSeats = [];
      roundActive = true;
    };

    // 굴리다 멈추면 이번 판에서 앉힌 자리만 되돌린다. 앞 판 결과는 남는다.
    const abortSeatRound = () => {
      if (roundActive) roundSeats.forEach((no) => delete seatAssignments[no]);
      roundSeats = [];
      roundActive = false;
      renderSeats();
    };

    const showTab = (tab) => {
      activeTab = tab;
      localStorage.setItem('mbr_tab', tab);
      tabButtons.forEach((button) => button.classList.toggle('active', button.dataset.tab === tab));
      Object.entries(sidePanels).forEach(([name, panel]) => {
        panel.hidden = name !== tab;
      });
      // 자리 모드는 고정·착석한 사람을 굴리지 않으므로 구슬을 다시 만든다. 진행 중엔 건드리지 않는다.
      if (!window.roulette.isRunning) getReady();
      renderSeats();
    };

    tabButtons.forEach((button) => button.addEventListener('click', () => showTab(button.dataset.tab)));

    // 목표 인원이 찬 뒤에도 구슬은 계속 결승선을 지난다. 이번 판 인원까지만 앉힌다.
    window.roulette.addEventListener('finish', (e) => {
      if (!roundActive || !isSeatMode() || e.detail.rank > window.options.winnerCount) return;
      seatPerson(e.detail.rank, e.detail);
      renderSeats();
    });

    document.addEventListener('names-ready', (e) => {
      seatPlan = e.detail.plan;
      if (!window.roulette.isRunning) roundSeats = [];
      renderSeats();
    });

    document.querySelector('#in_seatBatch').addEventListener('input', () => {
      if (!window.roulette.isRunning) applyWinnerSelection();
    });

    document.querySelector('#btnSeatClear').addEventListener('click', () => {
      if (window.roulette.isRunning) return;
      seatAssignments = {};
      roundSeats = [];
      getReady();
    });

    seatPlan = getSeatPlan();
    showTab(activeTab);

    document.querySelector('#btnMemoToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('memo-collapsed');
    });

    window.roulette.addEventListener('goal', (e) => {
      ready = false;
      const seatRound = isSeatMode();
      // 마지막 구슬은 결승선을 안 지나므로 여기서 남은 자리를 채운다. 결과 기억보다 먼저.
      if (seatRound && e.detail.entries) {
        const firstRank = window.options.winningRank + 2 - e.detail.entries.length;
        e.detail.entries.forEach((entry, i) => seatPerson(firstRank + i, entry));
        roundActive = false;
        renderSeats();
      }
      rememberResult(e.detail);
      updateTransport();
      settingsTimer = setTimeout(() => {
        settingsTimer = null;
        // 나눠서 굴릴 때 다음 판을 바로 시작할 수 있도록, 남은 사람으로 구슬을 다시 만든다.
        if (seatRound && isSeatMode()) getReady();
        document.querySelector('#settings').classList.remove('hide');
      }, 3000);
    });

    window.roulette.addEventListener('message', (e) => {
      simpleToast(e.detail);
    });

    const toggleBtn = document.querySelector('#btnToggleSettings');
    const collapsible = document.querySelector('.collapsible-rows');
    toggleBtn.addEventListener('click', () => {
      collapsible.classList.toggle('collapsed');
      toggleBtn.querySelector('.toggle-arrow').textContent =
        collapsible.classList.contains('collapsed') ? '▲' : '▼';
    });

    document.querySelector('#btnShuffle').click();
    updateTransport();

    const maps = window.roulette.getMaps();
    const mapSelector = document.querySelector('#sltMap');
    maps.forEach((map) => {
      const option = document.createElement('option');
      option.value = map.index;
      option.innerHTML = map.title;
      option.setAttribute('data-trans', '');
      window.translateElement(option);
      mapSelector.append(option);
    });
    mapSelector.addEventListener('change', (e) => {
      const index = e.target.value;
      window.roulette.setMap(index);
    });

    // const checkDonateButtonLoaded = () => {
    //   const btn = document.querySelector('span.bmc-btn-text');
    //   if (!btn) {
    //     setTimeout(checkDonateButtonLoaded, 100);
    //   } else {
    //     console.log('donation button has been loaded');
    //     btn.setAttribute('data-trans', '');
    //     window.translateElement(btn);
    //   }
    // };
    // setTimeout(checkDonateButtonLoaded, 100);

    function simpleToast(msg) {
      const toast = document.createElement('div');
      toast.classList.add('toast');
      toast.innerHTML = msg;

      if (window.translateElement) {
        console.log('try to translate');
        window.translateElement(toast);
      }

      document.body.appendChild(toast);
      setTimeout(() => {
        document.body.removeChild(toast);
      }, 1200);
    }

  }
</script>
<h1 class="sr-only">Marble Roulette - 랜덤 추첨기</h1>
<div id="settings" class="settings">
  <div class="right">
    <button id="btnToggleSettings" class="btn-toggle-settings">
      <span data-trans>Settings</span>
      <i class="toggle-arrow">▲</i>
    </button>
    <div class="collapsible-rows collapsed">
      <div class="row">
        <label for='sltMap'>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id="sltMap"></select>
      </div>
      <div class="row row-toggles">
        <div class='toggle-item'>
          <label for='chkAutoRecording'>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type="checkbox" id="chkAutoRecording" />
        </div>
        <div class='toggle-item'>
          <label for='chkSkill'>
            <i class="icon bomb"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type="checkbox" id="chkSkill" checked />
        </div>
      </div>
      <div class="row">
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class="btn-group">
          <button class="btn-winner btn-first-winner active" data-trans>First</button>
          <button class="btn-winner btn-last-winner" data-trans>Last</button>
          <input type="number" id="in_winningRank" value="1" min="1" />
        </div>
      </div>
      <div class="row">
        <label for='in_winnerCount'>
          <i class="icon trophy"></i>
          <span data-trans>Number of winners</span>
        </label>
        <div class="btn-group">
          <input type="number" id="in_winnerCount" value="1" min="1" />
        </div>
      </div>
      <div class="row row-theme">
        <div class='theme'>
          <i class='icon sun'></i>
          <input type='checkbox' id='chkDarkMode' checked />
          <i class='icon moon'></i>
        </div>
      </div>
    </div>
  </div>
  <div class="left">
    <h3 data-trans>Enter names below</h3>
    <input type="text" id="in_title" placeholder="Title (e.g. lunch menu)" data-trans="placeholder" />
    <textarea id="in_names" placeholder="Input names separated by commas or line feed here" data-trans="placeholder">수박*2,키위*2,귤*2</textarea>
    <div class="actions">
      <button id="btnShuffle">
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id="btnStart">
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
      <button id="btnPause" class="btn-icon-only" title="일시정지">
        <i class="icon pause"></i>
      </button>
      <button id="btnStop" class="btn-icon-only" title="정지">
        <i class="icon stop"></i>
      </button>
      <button id="btnMemoResult" data-trans>Add result</button>
    </div>
  </div>
</div>
<aside id="memo" class="memo">
  <div class="side-tabs">
    <button type="button" class="side-tab active" data-tab="memo" data-trans>Memo</button>
    <button type="button" class="side-tab" data-tab="seat" data-trans>Seats</button>
  </div>
  <section id="memoPanel" class="side-panel">
    <div class="memo-head">
      <span class="memo-name" data-trans>Memo</span>
      <button type="button" id="btnMemoCopy" class="memo-btn" data-trans>Copy</button>
      <button type="button" id="btnReset" class="memo-btn" data-trans>Reset</button>
    </div>
    <div id="memoBody" class="memo-body" contenteditable="plaintext-only" spellcheck="false"><div><br></div></div>
    <div class="memo-hint"># 제목 &nbsp;·&nbsp; ## 소제목 &nbsp;·&nbsp; 나머지는 본문</div>
  </section>
  <section id="seatPanel" class="side-panel" hidden>
    <div class="memo-head">
      <span class="memo-name" data-trans>Seat map</span>
      <button type="button" id="btnSeatLabelReset" class="memo-btn" hidden data-trans>Reset labels</button>
      <button type="button" id="btnSeatClear" class="memo-btn" data-trans>Clear seats</button>
    </div>
    <div class="seat-tools">
      <label for="in_seatBatch" data-trans>Draw this round</label>
      <input type="number" id="in_seatBatch" min="1" placeholder="전원" />
      <span id="seatStatus" class="seat-status"></span>
    </div>
    <div id="seatMap" class="seat-map"></div>
    <div class="memo-hint" data-trans>name@3 pins seat 3. Click a seat number to rename it</div>
  </section>
</aside>
<div id="speedControl" class="speed-control">
  <button type="button" class="speed-btn active" data-speed="1">1x</button>
  <button type="button" class="speed-btn" data-speed="2">2x</button>
  <button type="button" class="speed-btn" data-speed="4">4x</button>
</div>
<button type="button" id="btnMemoToggle" class="memo-toggle" title="메모 접기/펴기">☰</button>
<div class="copyright">Based on <a href="https://github.com/lazygyu/roulette" target="_blank">Marble Roulette</a> by lazygyu (MIT)
</div>
</body>
</html>
